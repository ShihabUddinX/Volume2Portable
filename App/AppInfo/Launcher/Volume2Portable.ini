[Launch]
ProgramExecutable64=Volume2\Volume2.exe
MinOS=XP
SplashTime=1000
WaitForEXE1=Volume2.exe
WaitForEXE2=Volume2PM.exe

[FileWrite1]
Type=INI
File=%PAL:DataDir%\Config\Config.ini
Section=Languages
Key=LangFileName
Value=%PAL:LanguageCustom%.lng

[FileWrite2]
Type=INI
File=%PAL:DataDir%\Config\Config.ini
Section=Languages
Key=LangName
Value=%PAL:LanguageCustom%

[Language]
Base=%PortableApps.comLocaleName%
CheckIfExists=%PAL:AppDir%\Volume2\Languages\%PAL:LanguageCustom%.lng
DefaultIfNotExists=English

[LanguageStrings]
SIMPCHINESE=Chinese(simplified)
TRADCHINESE=Chinese(traditional)
PortugueseBR=Brazilian

[FilesMove]
Config\*.ini=%PAL:AppDir%\Volume2
Logs\*.log=%PAL:AppDir%\Volume2